name: Build GREATNESS Android APK (THIS IS THE END BABY)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack THIS IS THE END BABY ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*THIS*END*BABY*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unpacking $ZIP_FILE..."
            rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
            unzip -o "$ZIP_FILE" -x ".github/*"
          else
            echo "ERROR: THIS IS THE END BABY.zip not found in repo root!"
            ls -la
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Universal Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Name Release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GREATNESS-THIS-IS-THE-END-BABY.apk

      - uses: actions/upload-artifact@v7
        with:
          path: GREATNESS-THIS-IS-THE-END-BABY.apk
          archive: false
